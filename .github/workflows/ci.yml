name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Format
        run: nix develop -c zig fmt --check build.zig src
      - name: Test
        run: nix develop -c zig build test --summary all
      - name: Cross-compile Windows and Linux
        if: runner.os == 'macOS'
        run: |
          nix develop -c zig build -Dtarget=x86_64-windows-gnu
          nix develop -c zig build -Dtarget=x86_64-linux-gnu
      - name: Flake checks (package and format)
        run: nix flake check -L
